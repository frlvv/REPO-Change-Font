name: Publish 1.2.1

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.2.1.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-1.2.1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'frlvv/REPO-Change-Font'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and verify release files
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/frlvv/REPO-Change-Font/58bae3f7ea399be34bc5710f93abb722a32e5126'
          curl --fail --silent --show-error --location "$base/R.E.P.O.%20Change%20Font.exe" --output 'R.E.P.O. Change Font.exe'
          curl --fail --silent --show-error --location "$base/SHA256SUMS.txt" --output SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          echo 'ae01b4caa991171b8c1aba29cd85684e0ea888b59f0a3a25d4f871bad49d181f  R.E.P.O. Change Font.exe' | sha256sum --check -
      - name: Publish EXE
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Шрифты заголовков и обычного текста для R.E.P.O.

          - Sexsmith включён по умолчанию.
          - Импорт TTF/OTF, библиотека шрифтов и предпросмотр.
          - Расстояние между буквами и восстановление исходного файла.
          - Тёмный интерфейс на русском и английском.

          Скачайте EXE, закройте игру, выберите шрифты и нажмите «Применить».

          Official builds are available only in this repository. Third-party modified or repackaged files are not official. See README and LICENSE.
          NOTES
          if gh release view v1.2.1 --repo "$GH_REPO" > /dev/null 2>&1; then
            gh release upload v1.2.1 'R.E.P.O. Change Font.exe' SHA256SUMS.txt --clobber --repo "$GH_REPO"
            gh release edit v1.2.1 --draft=false --latest --title 'R.E.P.O. Change Font 1.2.1' --notes-file notes.md --repo "$GH_REPO"
          else
            gh release create v1.2.1 'R.E.P.O. Change Font.exe' SHA256SUMS.txt --target 6d828e6c10383ec7c359fdcf79fee7441f692005 --title 'R.E.P.O. Change Font 1.2.1' --notes-file notes.md --latest --repo "$GH_REPO"
          fi
